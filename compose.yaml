services:
  dawn:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["serve"]
    # Explicit up/stop lifecycle. Never restart an unconfigured or failing model service in a loop.
    restart: "no"
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - dawn-data:/data
    # No published ports, host network, Docker socket or host credentials.
    # Legacy pi-home/pi-work volumes are no longer mounted; never delete them automatically.
    healthcheck:
      test: ["CMD", "dawn-container", "status"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 10s

volumes:
  dawn-data:
