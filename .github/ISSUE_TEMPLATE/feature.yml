name: Feature request
description: 提出新能力或方向
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目对"自主"、记忆、成长类能力有明确边界：不接受把未实现能力描述成已实现，也不接受让模型自行扩大权限。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到什么困难
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 尽量说明与现有六核心/协议/存储的关系
  - type: textarea
    id: boundary
    attributes:
      label: 权限、隐私与费用边界
      description: 需要哪些新权限？会读取什么数据？是否产生真实外部调用或费用？谁来授权和停止？
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 是否改动契约
      options:
        - 不改（实现细节）
        - 需要新 ADR（协议/schema/工具 schema/事务边界）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的其他做法
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我没有要求绕过现有校验、预算或停止机制
          required: true
        - label: 我没有附带真实密钥或私有数据
          required: true
